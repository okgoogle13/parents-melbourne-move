gaps:
  undisclosed_listing_items: [floor_area, year_built, storey_count, auction_location, price_history, solar, water_tanks, vendor_statement, special_conditions, renovation_permits, building_pest_report]
  listing_not_independently_checked: Listing read 29 Oct 2026 (B8 Task 8d); all property facts remain agent claims.
  statement_of_information_not_read: Linked from the listing; its comparable sales and suburb median are not yet recorded.
  listing_school_wording: '"Within Mount View Primary zone (STSA)": STSA is not defined on the listing.'
  portal_suburb_profiles: realestate.com.au and Domain suburb profiles not read (B8 Task 8c; blocked from cloud sessions).
  glen_waverley_not_in_buying_summary: The PDF has no Glen Waverley or 5 Northam Street content (macro gap G02). The family-and-school wording is the author's judgement; Claude in Chrome Task 8 (register B8) collects the evidence.
  glen_waverley_median_source: SuburbScorecard!Z7 names no source for the $1,763,500 sale median. Jellis Craig shows $1.68m (rolling 12 months, method not stated); which to show awaits user decision (P8).
  couples_with_children_figure: Removed 28 Oct 2026 (no source then). ABS 2021 now confirms 52.3% (Victoria 45.5%); reinstating it awaits user decision (P8).
  pdf_vs_workbook_prices:   # PDF medians have no stated source, index or period (macro gap G10); workbook governs
    - {suburb: Frankston, pdf_aud: 860000, workbook_aud: 834296, workbook_basis: sale median}
    - {suburb: Endeavour Hills, pdf_aud: 853000, workbook_aud: 857000, workbook_basis: SOI median}
    - {suburb: Springvale, pdf_aud: 924000, workbook_aud: 942500, workbook_basis: SOI median}
    - {suburb: Seaford, pdf_aud: 885000, workbook_aud: 861235, workbook_basis: AVM}
    - {suburb: Keysborough, pdf_aud: 960000, workbook_aud: 975000, workbook_basis: SOI median}
    - {suburb: Clayton South, pdf_aud: 982500, workbook_aud: 985000, workbook_basis: SOI median}
    - {suburb: Mordialloc, pdf_aud: 1252500, workbook_aud: 1401241, workbook_basis: AVM}
    - {suburb: Wheelers Hill, pdf_aud: 1455000, workbook_aud: 1475000, workbook_basis: SOI median}
  pdf_budget_wording: PDF says "below approximately $1.5 million"; Filters!B2 is a hard cap of $1,500,000 (macro gap G15).
  pdf_cites_this_repo: The PDF's source log includes this repo's foundation report, so its suburb wording is not independent evidence (macro gap G13).
  drive_bases_differ: Glen Waverley, Frankston and Seaford use Filters!B10 ("leave now", 26 Oct 2026); the four comparators use the top of the 10:00 weekday range, 28 Oct 2026.
  vermont_south: Not on SuburbScorecard.
