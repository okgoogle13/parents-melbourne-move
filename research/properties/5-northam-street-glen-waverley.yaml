  listing_id: "152636156"
  listed_on: 2026-10-15
  agents: [Natalie Visic, Alan Zhang]
  agency: Jellis Craig Glen Waverley
  property_type: house
  price_guide_aud: {low: 1550000, high: 1650000}
  sale_method: auction
  auction: 2026-11-14T11:00:00+11:00   # AEDT
  land_m2: 581
  bedrooms: 4
  bathrooms: 2
  car_spaces: 2
  levels: two                      # agent description ("Two-level family home")
  renovation: agent_claim_unverified
  school_claim: "Within Mount View Primary zone (STSA)"   # listing wording, 1.18 km; also lists Brentwood Secondary and Caulfield Grammar as nearby
  features: [north-facing alfresco and backyard, established gardens, irrigation, ducted heating, evaporative cooling, split-system air conditioning, video intercom, double garage with internal access]
  statement_of_information_linked: true   # "Property price statement" PDF; not read
  inspections: ["2026-10-29 16:00-16:30", "2026-10-31 12:00-12:30"]
  label: Needs verification        # all property fields are agent claims

school_zones_2027:
  primary: Mount View Primary School      # 1.11 km
  secondary: Brentwood Secondary College  # 2.3 km
  in_glen_waverley_secondary_college_zone: false   # GWSC 2.68 km; pin well inside Brentwood zone
  label: Checked
  source: findmyschool_vic

assessment:
  purchase_cap_aud: 1500000        # Filters!B2, hard cap; Checked
  guide_low_over_cap_aud: 50000
  guide_high_over_cap_aud: 150000
  budget_test: fail_at_advertised_guide   # Listings!G logic gives "Over cap", so T gives "Fails: budget"
  glen_waverley_house_median:
    value_aud: 1763500
    basis: sale median, rolling 12 months, 454 sales (SuburbScorecard!G7, H7; as at 26 Oct 2026)
    label: Needs verification      # workbook names no source for this figure
  drive_to_gw_min: 0
  stairs_filter: pass              # Filters!B6: stairs allowed (corrected 27 Oct 2026)
  market_timing:
    value: further_weakness_plausible_into_h1_2027
    label: Estimate
    source: buying summary section 1; base case follows NAB October forecast
  likely_trough: mid_2027          # Estimate
  hypothetical_trough:
    on_1500000_aud: {low: 1410000, high: 1440000}   # buying summary base case; Estimate
    further_fall_pct: {low: 4, high: 6}
    loss_on_1500000_aud: {low: 60000, high: 90000}  # Estimate (arithmetic)
    loss_on_1600000_aud: {low: 64000, high: 96000}  # Estimate (arithmetic)
  suburb_fit:
    family_school_market:
      value: true
      label: Needs verification    # author's judgement; not in the buying summary or workbook; B8 evidence below is mixed; wording awaits user decision (P8)
    abs_2021:                      # Glen Waverley vs Victoria; source abs_quickstats_2021_SAL21013
      couple_family_with_children_pct: {value: 52.3, victoria: 45.5, label: Checked}
      couple_family_without_children_pct: {value: 32.7, victoria: 37.6, label: Checked}
      one_parent_family_pct: {value: 13.6, victoria: 15.2, label: Checked}
      aged_0_14_pct: {value: 16.6, victoria: 18.0, label: Estimate}   # sum of Checked age bands
      aged_5_19_pct: {value: 19.2, victoria: 17.8, label: Estimate}
      aged_65_plus_pct: {value: 19.7, victoria: 16.8, label: Estimate}
      owned_outright_pct: {value: 41.0, victoria: 32.2, label: Checked}
      family_households_pct: {value: 78.3, victoria: 70.1, label: Checked}
    retiree_led_market: false      # author's judgement; ABS 2021 median age 40, 19.8% aged 65+ (SuburbScorecard!AM7, AN7)
    median_age: {value: 40, label: Checked, source: "SuburbScorecard!AM7, ABS 2021"}
    nature_access: good_but_not_superior     # judgement; Glen Waverley has no workbook nature score (N)
    community_band: {value: High, label: Checked, basis: "AX formula on AU7 60.8%, AQ7 8.0% India-born; display-only"}
    indian_community_fit: high_band_already  # only Clayton South (14.9%) has a higher India-born share among alternatives; secondary priority
  market_snapshot:                 # Jellis Craig suburb report, read 2026-10-28; Checked
    house_median_aud: 1680000      # rolling 12 months; month-on-month -1.75%
    auction_clearance_rate_pct: 59 # prior week
    median_days_on_market_house: 31
    average_hold_period_house_years: 14.6
  recommendation: do_not_bid_at_or_above_guide_without_exceptional_justification
  approval_required: true

