gaps:
  - {id: G01, topic: inflation, status: open, description: "The PDF gives no inflation readings; inflation appears only as scenario wording. Headline 4.3% and trimmed-mean 3.7% (2026-Q3) come from the handover, sourced to a news report of ABS data.", pdf_value: null, handover_value: "4.3% headline, 3.7% trimmed mean", resolution: "Shown, tagged handover; Needs verification."}
  - {id: G02, topic: glen_waverley_exception, status: open, description: "The PDF has no 5 Northam Street or Glen Waverley content. All property facts come from the handover and the task prompt.", pdf_value: null, handover_value: "see handover section 5", resolution: "Handled in research/properties/ (Phase 2), tagged handover / user_prompt."}
  - {id: G03, topic: hypothetical_house_trough, status: resolved_by_decision, description: "Mid-2027 value of a $1.5m house: PDF $1.41m–$1.44m vs handover $1.425m–$1.44m.", pdf_value: "1410000–1440000", handover_value: "1425000–1440000", resolution: "PDF used (user decision 1, 28 Oct 2026). Handover range is a logged conflict, not an alternative forecast."}
  - {id: G04, topic: cash_rate_dates, status: resolved_by_decision, description: "Handover dates the RBA source 2026-09-30; the PDF dates it 28 Oct 2026.", pdf_value: "2026-10-28 (source date)", handover_value: "2026-09-30", resolution: "Not a conflict: effective_date 2026-09-30 and source_publication_date 2026-10-28 kept as separate fields (user decision 2)."}
  - {id: G05, topic: clayton_south_tier, status: resolved_by_decision, description: "The PDF lists Clayton South under Conditional targets with an 'Opportunistic only' approach; the handover gives tier opportunistic_only, rank 8.", pdf_value: "conditional", handover_value: "opportunistic_only, rank 8", resolution: "Handover tier and rank adopted; PDF buyer approach kept (user decision 3)."}
  - {id: G06, topic: indicator_attribution, status: open, description: "The PDF snapshot table does not attribute readings to sources. source_id comes from the handover or from a name/date match to the PDF source log (see source_attribution on each value).", pdf_value: null, handover_value: null, resolution: "Attribution basis recorded per value."}
  - {id: G07, topic: vendor_discounting, status: open, description: "No source or date for the 3.9% median vendor discount in either input.", pdf_value: "3.9% median across capitals", handover_value: null, resolution: "source_id null; Needs verification."}
  - {id: G08, topic: index_comparability, status: open, description: "The PDF does not name the index behind -6.2% annual / -0.2% monthly (handover: PropTrack). The -3.3% quarterly figure is Domain. PropTrack, Domain and Cotality are different indices.", pdf_value: null, handover_value: "PropTrack (annual, monthly); Domain (quarterly)", resolution: "Never average or chain figures from different indices."}
  - {id: G09, topic: indicator_scope, status: open, description: "Indicators have different geographic scopes: days on market is Victoria, vendor discount is all capitals, arrears are system-wide, cash rate is national.", pdf_value: null, handover_value: null, resolution: "scope field on every indicator."}
  - {id: G10, topic: suburb_median_basis, status: open, description: "Suburb medians and changes in the PDF have no stated source, index, period or basis. They differ from workbook column G (e.g. sale median vs AVM vs SOI).", pdf_value: null, handover_value: null, resolution: "Not compared like-for-like with the workbook; workbook governs suburb prices."}
  - {id: G11, topic: suburb_order_vs_workbook, status: open, description: "PDF market-timing order (Frankston, Endeavour Hills, Springvale, Seaford...) differs from workbook ranks (Frankston #1, Mordialloc #2, Seaford #3; comparators unranked). The PDF's eight suburbs omit the Clyde North comparator.", pdf_value: null, handover_value: null, resolution: "Tiers kept as market-timing priority only; workbook unchanged. Raised in macro-impact-review.md."}
  - {id: G12, topic: unused_sources, status: open, description: "CBA is in the PDF source log but not cited in the PDF body. Handover lists AFR, Westpac, ANZ, KPMG and Oxford Economics with no values used.", pdf_value: null, handover_value: null, resolution: "Listed in sources.yaml; validator reports them as unreferenced."}
