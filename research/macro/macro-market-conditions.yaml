# Canonical macro market conditions — Melbourne established houses.
# Read research/macro/README.md before using. Validate: .venv/bin/python tools/validate_macro.py
#
# Every value object carries:
#   kind        fact | forecast | scenario | modelled_estimate | guidance | statement
#   label       project evidence label (Checked | Estimate | Needs verification | Needs data | N/A)
#               Reported readings = Needs verification (copied from an input, not checked against
#               the named source in this repo). Forecasts, scenarios, modelled figures = Estimate.
#   provenance  pdf | handover | user_decision | project_policy | workbook
#   source_id   id in sources.yaml, or null
#   source_attribution  how source_id was assigned: pdf_text | pdf_source_log_match | handover | null
#   pdf_quote   exact PDF wording (required when provenance is pdf; checked by the validator)
# The PDF wins on any conflict; conflicts are logged in `gaps`, never offered as alternatives.

meta:
  report_id: melbourne-established-house-buying-summary
  title: Melbourne Established-House Buying Summary
  version: 2026.10.28.1
  prepared_on: 2026-10-28
  data_current_to: 2026-10-28
  scope: established_detached_houses
  geography: Melbourne
  primary_forecast_source_id: nab_housing_monitor_october_2026
  freshness_rule: macro_market_conditions   # see freshness.yaml; status is computed, not stored
  snapshot: research/macro/snapshots/2026-10-28.yaml
  target_price:
    pdf_wording:
      value: below approximately $1.5 million
      kind: statement
      label: N/A
      provenance: pdf
      source_id: input_pdf
      source_attribution: pdf_text
      pdf_quote: "below approximately $1.5 million"
    workbook_cap:
      value: 1500000
      unit: AUD
      kind: fact
      label: Checked
      provenance: workbook
      source_id: null
      source_attribution: null
      note: >
        Filters!B2, confirmed family decision 27 Oct 2026: hard cap of $1,500,000 maximum
        purchase price, excluding transaction and moving costs. The workbook governs budget (gap G15).
  disclaimer:
    value: >
      General market research and decision framework only. Not financial, tax, legal or credit
      advice. Ownership, title, duty and concession issues are being assessed separately and
      should not affect the market-timing conclusion.
    kind: statement
    label: N/A
    provenance: pdf
    source_id: input_pdf
    source_attribution: pdf_text
    pdf_quote: "Not financial, tax, legal or credit advice."
  exclusions:
    note: Excluded from macro timing analysis (task brief, 28 Oct 2026).
    topics: [ownership, title, stamp_duty, first_home_buyer_concessions, guarantors, centrelink, capital_gains_tax, estate_planning]
  workbook_relationship: >
    Macro layer provides market context; it never overrides the workbook on suburb ranks, budget
    or filters. market_timing_tiers below are not workbook ranks and do not change SuburbScorecard C or L.

bottom_line:
  current_conditions:
    value: >
      Melbourne's established-house market is clearly soft. House prices have fallen for 11
      consecutive months, auction clearance is weak, homes are taking longer to sell and buyers
      have more negotiating power.
    kind: statement
    label: Needs verification
    provenance: pdf
    source_id: null
    source_attribution: null
    pdf_quote: "House prices have fallen for 11 consecutive months"
  main_risks:
    value: >
      Further interest-rate rises, weaker employment, rising mortgage stress and more unsold
      listings could extend the price decline.
    kind: statement
    label: Estimate
    provenance: pdf
    source_id: null
    source_attribution: null
    pdf_quote: "further interest-rate rises, weaker employment, rising mortgage stress and more unsold listings could extend the price decline"
  main_supports:
    value: >
      Population growth, high rents, low rental vacancies and constrained new-home construction
      continue to support underlying demand.
    kind: statement
    label: Estimate
    provenance: pdf
    source_id: null
    source_attribution: null
    pdf_quote: "population growth, high rents, low rental vacancies and constrained new-home construction continue to support underlying demand"
  forecast_range:
    value: >
      The most likely path is further weakness into the first half of 2027, with a trough around
      mid-2027 and a further decline from today's prices of roughly 4%–6%.
    kind: forecast
    label: Estimate
    provenance: pdf
    source_id: nab_housing_monitor_october_2026
    source_attribution: pdf_text
    pdf_quote: "a trough around mid-2027 and a further decline from today’s prices of roughly 4%–6%"
  practical_timing:
    value: >
      Remain patient and negotiate firmly, but do not rule out buying a genuinely suitable,
      well-priced house before the trough.
    kind: guidance
    label: N/A
    provenance: pdf
    source_id: null
    source_attribution: null
    pdf_quote: "remain patient and negotiate firmly, but do not rule out buying a genuinely suitable, well-priced house before the trough"

