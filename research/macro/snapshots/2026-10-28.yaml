bottom_line:
  current_conditions:
    value: 'Melbourne''s established-house market is clearly soft. House prices have fallen for 11 consecutive
      months, auction clearance is weak, homes are taking longer to sell and buyers have more negotiating
      power.

      '
    kind: statement
    label: Needs verification
    provenance: pdf
    source_id: null
    source_attribution: null
    pdf_quote: House prices have fallen for 11 consecutive months
  main_risks:
    value: 'Further interest-rate rises, weaker employment, rising mortgage stress and more unsold listings
      could extend the price decline.

      '
    kind: statement
    label: Estimate
    provenance: pdf
    source_id: null
    source_attribution: null
    pdf_quote: further interest-rate rises, weaker employment, rising mortgage stress and more unsold
      listings could extend the price decline
  main_supports:
    value: 'Population growth, high rents, low rental vacancies and constrained new-home construction
      continue to support underlying demand.

      '
    kind: statement
    label: Estimate
    provenance: pdf
    source_id: null
    source_attribution: null
    pdf_quote: population growth, high rents, low rental vacancies and constrained new-home construction
      continue to support underlying demand
  forecast_range:
    value: 'The most likely path is further weakness into the first half of 2027, with a trough around
      mid-2027 and a further decline from today''s prices of roughly 4%–6%.

      '
    kind: forecast
    label: Estimate
    provenance: pdf
    source_id: nab_housing_monitor_october_2026
    source_attribution: pdf_text
    pdf_quote: a trough around mid-2027 and a further decline from today’s prices of roughly 4%–6%
  practical_timing:
    value: 'Remain patient and negotiate firmly, but do not rule out buying a genuinely suitable, well-priced
      house before the trough.

      '
    kind: guidance
    label: N/A
    provenance: pdf
    source_id: null
    source_attribution: null
    pdf_quote: remain patient and negotiate firmly, but do not rule out buying a genuinely suitable, well-priced
      house before the trough
